<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday, Bhavadharani</title>
    <meta
      name="description"
      content="A magical birthday web experience for Bhavadharani, the love of my life."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261114" />
  </head>
  <body>
    <div class="page-cake-decor" aria-hidden="true">
      <div class="mini-cake c1"><span></span></div>
      <div class="mini-cake c2"><span></span></div>
      <div class="mini-cake c3"><span></span></div>
      <div class="mini-cake c4"><span></span></div>
    </div>

    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Forever Yours</div>
      </header>

      <main>
        <section id="landing" class="panel landing">
          <div class="floating-orb orb-1"></div>
          <div class="floating-orb orb-2"></div>
          <div class="floating-orb orb-3"></div>
          <div class="heart-field" aria-hidden="true">
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
            <span>❤</span>
          </div>

          <div class="landing-content">
            <div class="cta-row single-button-row">
              <button type="button" id="clickMeBtn" class="primary-btn landing-button">Click me</button>
            </div>

            <div id="birthdayPuzzle" class="puzzle-card hidden" aria-live="polite">
              <p class="puzzle-label">Enter your birthday date</p>

              <div class="mini-puzzle">
                <label for="birthdayInput">Birthday date</label>
                <div class="puzzle-row single-input">
                  <input id="birthdayInput" type="text" placeholder="dd-mm-yyyy" maxlength="10" aria-label="Birthday date" />
                </div>
              </div>

              <button type="button" id="verifyBirthdayBtn" class="primary-btn puzzle-submit" disabled>Unlock</button>
              <p id="puzzleMessage" class="puzzle-message"></p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js?v=20261114"></script>
  </body>
</html>
