<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=20261114" />
  </head>
  <body>
    <div class="page-cake-decor" aria-hidden="true">
      <div class="mini-cake c1"><span></span></div>
      <div class="mini-cake c2"><span></span></div>
      <div class="mini-cake c3"><span></span></div>
      <div class="mini-cake c4"><span></span></div>
    </div>

    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Forever Yours</div>
      </header>

      <main>
        <section id="countdown" class="panel countdown">
          <div class="section-header">
            <p class="eyebrow">The countdown begins</p>
            <h2 class="page-title">
              <span class="sparkle">✦</span>
              Happy Birthday, mylove Bhavadharani
              <span class="sparkle-right">✦</span>
            </h2>
          </div>

          <div class="memory-photo">
            <img src="assets/69933.png" alt="Bhavadharani countdown portrait" />
          </div>

          <div class="countdown-card">
            <div class="wish-text">
              <p>Every year with you is a gift I never want to unwrap, mylove.</p>
              <h3>May your heart stay as warm as the sun and as bright as the stars.</h3>
            </div>

            <audio id="birthdaySong" preload="auto">
              <source src="song.mp3" type="audio/mpeg" />
            </audio>

            <div class="song-controls page-btns">
              <a href="birthday.html" class="ghost-btn">Go back</a>
              <button id="playSongBtn" class="ghost-btn">Play song</button>
              <a href="letters.html" class="primary-btn">Next</a>
            </div>

            <div class="countdown-grid" id="countdownGrid">
              <div class="time-unit">
                <span id="days">00</span>
                <small>Days</small>
              </div>
              <div class="time-unit">
                <span id="hours">00</span>
                <small>Hours</small>
              </div>
              <div class="time-unit">
                <span id="minutes">00</span>
                <small>Minutes</small>
              </div>
              <div class="time-unit">
                <span id="seconds">00</span>
                <small>Seconds</small>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js?v=20261114"></script>
  </body>
</html>
